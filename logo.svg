    <circle cx="250" cy="255" r="175" fill="none" stroke-width="2" stroke-dasharray="0 80 150 200 80 300" stroke-dashoffset="0" />
    <circle cx="250" cy="255" r="205" fill="none" stroke-width="2" stroke-dasharray="0 300 120 200 60 200" stroke-dashoffset="150" />
    <g stroke-width="6">
      <line x1="150" y1="380" x2="250" y2="110" />
      <line x1="250" y1="110" x2="350" y2="380" />
      <line x1="200" y1="245" x2="300" y2="315" />
    </g>
    <g fill="#6a1f2b" stroke="none">
