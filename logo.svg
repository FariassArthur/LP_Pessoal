<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 35 440 440" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Monograma AF</title>
  <desc id="logo-desc">Letra A com traço central inclinado, envolvida por anéis circulares interrompidos e pontos de conexão.</desc>
  <g stroke="#6a1f2b" stroke-linecap="round" stroke-linejoin="round">
